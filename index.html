<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>우주 별의 색 카드 짝맞추기 게임 (42장)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Noto+Sans+KR:wght@300;400;600;700&display=swap');

        body {
            font-family: 'Noto Sans KR', sans-serif;
            background: radial-gradient(ellipse at bottom, #1b2735 0%, #090a0f 100%);
            min-height: 100vh;
            color: #ffffff;
            overflow-x: hidden;
        }

        .title-font {
            font-family: 'Orbitron', 'Noto Sans KR', sans-serif;
        }

        /* 3D Card Flip Animation */
        .card-container {
            perspective: 1000px;
        }

        .card-inner {
            position: relative;
            width: 100%;
            height: 100%;
            text-align: center;
            transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1);
            transform-style: preserve-3d;
            cursor: pointer;
        }

        .card-container.flipped .card-inner {
            transform: rotateY(180deg);
        }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            -webkit-backface-visibility: hidden;
            backface-visibility: hidden;
            border-radius: 0.75rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 0.25rem;
            box-shadow: 0 6px 15px rgba(0, 0, 0, 0.6);
            border: 2px solid rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(8px);
        }

        .card-front {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
        }

        .card-front:hover {
            border-color: #38bdf8;
            box-shadow: 0 0 12px rgba(56, 189, 248, 0.4);
        }

        .card-back {
            background: linear-gradient(145deg, #0f172a 0%, #1e1b4b 100%);
            transform: rotateY(180deg);
        }

        .card-container.matched .card-back {
            border-color: #10b981;
            box-shadow: 0 0 15px rgba(16, 185, 129, 0.7);
            animation: pulse-glow 2s infinite alternate;
        }

        @keyframes pulse-glow {
            0% { box-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
            100% { box-shadow: 0 0 20px rgba(16, 185, 129, 0.9); }
        }

        /* Star Color Text & Glow Themes */
        .color-blue { color: #60a5fa; text-shadow: 0 0 10px #3b82f6; }
        .color-skyblue { color: #a5f3fc; text-shadow: 0 0 10px #38bdf8; }
        .color-white { color: #f8fafc; text-shadow: 0 0 10px #e2e8f0; }
        .color-yellowwhite { color: #fef08a; text-shadow: 0 0 10px #fde047; }
        .color-yellow { color: #facc15; text-shadow: 0 0 10px #eab308; }
        .color-orange { color: #fb923c; text-shadow: 0 0 10px #f97316; }
        .color-red { color: #f87171; text-shadow: 0 0 10px #ef4444; }

        /* Canvas background for animated stars */
        #stars-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            pointer-events: none;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <canvas id="stars-bg"></canvas>

    <header class="py-3 px-4 sm:px-6 bg-slate-900/70 backdrop-blur-md border-b border-slate-800 sticky top-0 z-20">
        <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-user-astronaut text-2xl sm:text-3xl text-cyan-400 animate-bounce"></i>
                <div>
                    <h1 class="text-lg sm:text-xl font-bold title-font bg-clip-text text-transparent bg-gradient-to-r from-cyan-400 via-sky-300 to-indigo-400">
                        우주 별의 색 카드 짝맞추기 (42장)
                    </h1>
                    <p class="text-xs text-slate-400">총 42개 카드 (7종류 × 각 6장) · 같은 색상 명칭의 카드 2장을 찾아보세요!</p>
                </div>
            </div>

            <!-- Stats Bar & Quick Controls -->
            <div class="flex items-center gap-3 bg-slate-950/80 px-3.5 py-1.5 rounded-full border border-slate-700 text-xs sm:text-sm flex-wrap justify-center shadow-lg">
                <div class="flex items-center gap-1.5">
                    <i class="fa-regular fa-clock text-cyan-400"></i>
                    <span id="timer-display" class="font-mono font-semibold text-cyan-300">00:00</span>
                </div>
                <div class="h-4 w-[1px] bg-slate-700"></div>
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-arrows-rotate text-emerald-400"></i>
                    <span class="text-slate-400">시도:</span>
                    <span id="moves-display" class="font-bold text-emerald-300">0</span>
                </div>
                <div class="h-4 w-[1px] bg-slate-700"></div>
                <div class="flex items-center gap-1.5">
                    <i class="fa-solid fa-star text-amber-400"></i>
                    <span class="text-slate-400">성공:</span>
                    <span id="score-display" class="font-bold text-amber-300">0 / 21</span>
                </div>
                
                <button id="share-qr-btn" class="ml-1 px-2.5 py-1 bg-purple-600 hover:bg-purple-500 text-white font-medium rounded-full text-xs transition duration-200 shadow-md shadow-purple-900/50 flex items-center gap-1">
                    <i class="fa-solid fa-qrcode"></i> QR 공유
                </button>
                <button id="restart-btn" class="px-2.5 py-1 bg-cyan-600 hover:bg-cyan-500 text-white font-medium rounded-full text-xs transition duration-200 shadow-md shadow-cyan-900/50 flex items-center gap-1">
                    <i class="fa-solid fa-rotate-right"></i> 다시 시작
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow flex flex-col items-center justify-center p-3 md:p-6 max-w-7xl mx-auto w-full">
        <!-- Responsive Grid for 42 Cards (7 columns layout) -->
        <div id="game-grid" class="grid grid-cols-6 sm:grid-cols-7 gap-2.5 sm:gap-3.5 w-full max-w-[1050px] my-auto p-3 sm:p-5 bg-slate-900/50 backdrop-blur-md rounded-3xl border border-slate-800 shadow-2xl">
            <!-- 42 Cards will be dynamically injected here by JS -->
        </div>
    </main>

    <footer class="bg-slate-950/90 border-t border-slate-800 py-3 px-4 text-xs">
        <div class="max-w-6xl mx-auto flex flex-wrap items-center justify-center gap-3 sm:gap-5 text-slate-300">
            <span class="font-semibold text-cyan-400 flex items-center gap-1"><i class="fa-solid fa-circle-info"></i> 별의 색상 가이드:</span>
            <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-blue-500 shadow-sm shadow-blue-500"></span> 청색</div>
            <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-sky-300 shadow-sm shadow-sky-300"></span> 청백색</div>
            <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-slate-100 shadow-sm shadow-slate-100"></span> 백색</div>
            <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-yellow-200 shadow-sm shadow-yellow-200"></span> 황백색</div>
            <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-yellow-400 shadow-sm shadow-yellow-400"></span> 황색</div>
            <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-orange-400 shadow-sm shadow-orange-400"></span> 주황색</div>
            <div class="flex items-center gap-1"><span class="w-2.5 h-2.5 rounded-full bg-red-500 shadow-sm shadow-red-500"></span> 적색</div>
        </div>
    </footer>

    <div id="qr-modal" class="fixed inset-0 bg-black/80 backdrop-blur-lg z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-slate-800 to-slate-950 border border-slate-700 p-6 sm:p-8 rounded-3xl max-w-sm w-full text-center shadow-2xl relative">
            <h3 class="text-xl font-bold title-font text-white mb-2"><i class="fa-solid fa-qrcode text-purple-400"></i> 학생 입장용 QR 코드</h3>
            <p class="text-xs text-slate-300 mb-4">스마트폰 카메라로 스캔하여 게임에 바로 접속할 수 있습니다.</p>
            
            <div class="bg-white p-4 rounded-2xl inline-block mx-auto mb-4 shadow-inner" id="qrcode-container"></div>
            
            <div class="text-xs text-slate-400 bg-slate-900 p-2.5 rounded-xl border border-slate-800 mb-5 break-all font-mono select-all" id="current-url-text">
                URL Loading...
            </div>

            <div class="flex gap-2">
                <button id="copy-url-btn" class="flex-1 py-2.5 bg-slate-700 hover:bg-slate-600 text-white rounded-xl text-xs font-bold transition duration-200 flex items-center justify-center gap-1">
                    <i class="fa-regular fa-copy"></i> 주소 복사
                </button>
                <button id="close-qr-btn" class="flex-1 py-2.5 bg-purple-600 hover:bg-purple-500 text-white rounded-xl text-xs font-bold transition duration-200">
                    닫기
                </button>
            </div>
        </div>
    </div>

    <div id="victory-modal" class="fixed inset-0 bg-black/80 backdrop-blur-lg z-50 hidden flex items-center justify-center p-4">
        <div class="bg-gradient-to-b from-slate-800 to-slate-950 border border-slate-700 p-8 rounded-3xl max-w-md w-full text-center shadow-2xl relative overflow-hidden">
            <div class="w-20 h-20 bg-gradient-to-tr from-amber-400 to-yellow-200 rounded-full flex items-center justify-center mx-auto mb-4 shadow-lg shadow-amber-500/30 animate-pulse">
                <i class="fa-solid fa-trophy text-4xl text-slate-950"></i>
            </div>

            <h2 class="text-3xl font-extrabold text-white mb-2 title-font">미션 성공!</h2>
            <p class="text-slate-300 mb-6 text-sm">42장의 별 색상 카드 짝맞추기를 완벽하게 성공했습니다!</p>

            <div class="bg-slate-900/80 rounded-2xl p-4 mb-6 border border-slate-800 grid grid-cols-2 gap-4 text-left">
                <div>
                    <span class="text-xs text-slate-400 block">소요 시간</span>
                    <span id="final-time" class="text-xl font-mono font-bold text-cyan-300">00:00</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 block">총 시도 횟수</span>
                    <span id="final-moves" class="text-xl font-mono font-bold text-emerald-300">0회</span>
                </div>
            </div>

            <button id="modal-restart-btn" class="w-full py-3.5 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold rounded-xl shadow-lg shadow-cyan-500/25 transition duration-200 flex items-center justify-center gap-2">
                <i class="fa-solid fa-arrows-rotate"></i> 다시 도전하기
            </button>
        </div>
    </div>

    <script>
        // 7 Star Types matching request (7 colors, each has 6 cards = 21 pairs total)
        const STAR_TYPES = [
            { name: "청색", class: "O형", colorClass: "color-blue" },
            { name: "청백색", class: "B형", colorClass: "color-skyblue" },
            { name: "백색", class: "A형", colorClass: "color-white" },
            { name: "황백색", class: "F형", colorClass: "color-yellowwhite" },
            { name: "황색", class: "G형", colorClass: "color-yellow" },
            { name: "주황색", class: "K형", colorClass: "color-orange" },
            { name: "적색", class: "M형", colorClass: "color-red" }
        ];

        let cards = [];
        let flippedCards = [];
        let matchedPairsCount = 0;
        let moves = 0;
        let timerInterval = null;
        let secondsElapsed = 0;
        let isBoardLocked = false;
        let gameStarted = false;

        const gameGrid = document.getElementById('game-grid');
        const timerDisplay = document.getElementById('timer-display');
        const movesDisplay = document.getElementById('moves-display');
        const scoreDisplay = document.getElementById('score-display');
        const restartBtn = document.getElementById('restart-btn');
        const shareQrBtn = document.getElementById('share-qr-btn');
        const qrModal = document.getElementById('qr-modal');
        const closeQrBtn = document.getElementById('close-qr-btn');
        const copyUrlBtn = document.getElementById('copy-url-btn');
        const currentUrlText = document.getElementById('current-url-text');
        const victoryModal = document.getElementById('victory-modal');
        const finalTime = document.getElementById('final-time');
        const finalMoves = document.getElementById('final-moves');
        const modalRestartBtn = document.getElementById('modal-restart-btn');

        // Background Starfield Canvas Animation
        function initStarfield() {
            const canvas = document.getElementById('stars-bg');
            const ctx = canvas.getContext('2d');
            let stars = [];

            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                stars = [];
                const numStars = Math.floor((canvas.width * canvas.height) / 2500);
                for (let i = 0; i < numStars; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 1.5,
                        alpha: Math.random(),
                        speed: Math.random() * 0.01 + 0.005
                    });
                }
            }

            function animate() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                    star.alpha += star.speed;
                    if (star.alpha > 1 || star.alpha < 0) star.speed = -star.speed;
                    ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0, star.alpha)})`;
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fill();
                });
                requestAnimationFrame(animate);
            }

            window.addEventListener('resize', resize);
            resize();
            animate();
        }

        // Create 42 Cards Deck (7 types * 6 cards each = 21 pairs)
        function createDeck() {
            let deck = [];
            STAR_TYPES.forEach((starType, idx) => {
                for (let i = 0; i < 6; i++) {
                    deck.push({ ...starType, id: idx, uid: `${idx}-${i}` });
                }
            });

            // Fisher-Yates Shuffle
            for (let i = deck.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [deck[i], deck[j]] = [deck[j], deck[i]];
            }
            return deck;
        }

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            secondsElapsed = 0;
            timerDisplay.textContent = "00:00";
            timerInterval = setInterval(() => {
                secondsElapsed++;
                const mins = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
                const secs = String(secondsElapsed % 60).padStart(2, '0');
                timerDisplay.textContent = `${mins}:${secs}`;
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function initGame() {
            stopTimer();
            cards = createDeck();
            flippedCards = [];
            matchedPairsCount = 0;
            moves = 0;
            gameStarted = false;
            isBoardLocked = false;

            movesDisplay.textContent = "0";
            scoreDisplay.textContent = "0 / 21";
            timerDisplay.textContent = "00:00";
            victoryModal.classList.add('hidden');

            renderGrid();
        }

        function renderGrid() {
            gameGrid.innerHTML = '';
            cards.forEach((card, index) => {
                const cardEl = document.createElement('div');
                cardEl.className = 'card-container aspect-[3/4] w-full';
                cardEl.dataset.index = index;

                cardEl.innerHTML = `
                    <div class="card-inner">
                        <div class="card-front">
                            <i class="fa-solid fa-star text-slate-600 text-xl sm:text-2xl opacity-70"></i>
                            <span class="text-[9px] text-slate-500 font-mono mt-1">STAR</span>
                        </div>
                        <div class="card-back">
                            <i class="fa-solid fa-sun ${card.colorClass} text-xl sm:text-2xl md:text-3xl mb-1"></i>
                            <span class="font-bold text-xs sm:text-sm md:text-base ${card.colorClass}">${card.name}</span>
                            <span class="text-[9px] sm:text-[10px] text-slate-300 font-mono mt-0.5">${card.class}</span>
                        </div>
                    </div>
                `;

                cardEl.addEventListener('click', () => handleCardClick(cardEl, index));
                gameGrid.appendChild(cardEl);
            });
        }

        function handleCardClick(cardEl, index) {
            if (isBoardLocked) return;
            if (cardEl.classList.contains('flipped') || cardEl.classList.contains('matched')) return;

            if (!gameStarted) {
                gameStarted = true;
                startTimer();
            }

            cardEl.classList.add('flipped');
            flippedCards.push({ element: cardEl, data: cards[index] });

            if (flippedCards.length === 2) {
                moves++;
                movesDisplay.textContent = moves;
                checkMatch();
            }
        }

        function checkMatch() {
            isBoardLocked = true;
            const [card1, card2] = flippedCards;

            // 같은 명칭(id)의 카드 2장을 뒤집으면 매칭 성공
            if (card1.data.id === card2.data.id) {
                setTimeout(() => {
                    card1.element.classList.add('matched');
                    card2.element.classList.add('matched');
                    matchedPairsCount++;
                    scoreDisplay.textContent = `${matchedPairsCount} / 21`;
                    flippedCards = [];
                    isBoardLocked = false;

                    if (matchedPairsCount === 21) {
                        handleVictory();
                    }
                }, 400);
            } else {
                setTimeout(() => {
                    card1.element.classList.remove('flipped');
                    card2.element.classList.remove('flipped');
                    flippedCards = [];
                    isBoardLocked = false;
                }, 900);
            }
        }

        function handleVictory() {
            stopTimer();
            finalTime.textContent = timerDisplay.textContent;
            finalMoves.textContent = `${moves}회`;
            setTimeout(() => {
                victoryModal.classList.remove('hidden');
            }, 500);
        }

        // Setup QR Code Modal
        function setupQRModal() {
            const currentUrl = window.location.href;
            currentUrlText.textContent = currentUrl;
            
            const qrContainer = document.getElementById('qrcode-container');
            qrContainer.innerHTML = '';
            new QRCode(qrContainer, {
                text: currentUrl,
                width: 160,
                height: 160,
                colorDark: "#090a0f",
                colorLight: "#ffffff",
                correctLevel: QRCode.CorrectLevel.H
            });
        }

        shareQrBtn.addEventListener('click', () => {
            setupQRModal();
            qrModal.classList.remove('hidden');
        });

        closeQrBtn.addEventListener('click', () => {
            qrModal.classList.add('hidden');
        });

        copyUrlBtn.addEventListener('click', () => {
            const currentUrl = window.location.href;
            const textArea = document.createElement("textarea");
            textArea.value = currentUrl;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                copyUrlBtn.innerHTML = '<i class="fa-solid fa-check text-emerald-300"></i> 복사 완료!';
                setTimeout(() => {
                    copyUrlBtn.innerHTML = '<i class="fa-regular fa-copy"></i> 주소 복사';
                }, 2000);
            } catch (err) {
                alert('주소 복사에 실패했습니다.');
            }
            document.body.removeChild(textArea);
        });

        restartBtn.addEventListener('click', initGame);
        modalRestartBtn.addEventListener('click', initGame);

        window.onload = function() {
            initStarfield();
            initGame();
        };
    </script>
</body>
</html>
